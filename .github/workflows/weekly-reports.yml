name: Weekly Reports

# Uruchamia się co poniedziałek o 06:00 UTC
# = 08:00 czasu polskiego latem (CEST), 07:00 zimą (CET)
# Można też uruchomić ręcznie z UI GitHub (workflow_dispatch).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  send-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly sender
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: python weekly_sender.py
